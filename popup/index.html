<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>catPlugin</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <span class="mark" aria-hidden="true">C</span>
        <div>
          <h1>catPlugin</h1>
          <p>Excel translation fill</p>
        </div>
      </header>

      <section class="workspace">
        <input id="file-input" type="file" accept=".xlsx,.xls" hidden />
        <button id="upload-button" class="upload" type="button">
          <span>Choose Excel file</span>
          <span aria-hidden="true">＋</span>
        </button>
        <p id="file-info" class="file-info">No file selected</p>

        <div class="actions">
          <button id="export-button" class="secondary" type="button">Export</button>
          <button id="fill-button" class="primary" type="button" disabled>Fill</button>
        </div>
        <button id="stop-button" class="stop" type="button" disabled>Stop current run</button>

        <details class="options">
          <summary>Options</summary>
          <div class="option-row">
            <label for="auto-stop-count">Stop after</label>
            <input
              id="auto-stop-count"
              type="number"
              min="1"
              step="1"
              inputmode="numeric"
              placeholder="No limit"
            />
          </div>
          <label class="toggle" for="enable-memoq-marker-fill">
            <input id="enable-memoq-marker-fill" type="checkbox" />
            <span>memoQ marker fill (experimental)</span>
          </label>
        </details>

        <p id="status" class="status" data-kind="default">Ready</p>
      </section>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
